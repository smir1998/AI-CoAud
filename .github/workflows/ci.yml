name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # provenance step diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          # match the runtime in backend/Dockerfile
          python-version: "3.12"

      - name: backend provenance
        # This repo has two automated committers; failures were repeatedly
        # caused by a stale manifest winning a merge. This step puts the
        # answer to "which tree actually ran?" at the TOP of every log.
        run: |
          echo "── head ──"
          git log --oneline -1
          echo "── last 5 commits touching backend/ or ci.yml ──"
          git log --oneline -5 -- backend/ .github/workflows/ci.yml
          if git rev-parse --verify origin/main >/dev/null 2>&1 \
             && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "── backend/ diff vs origin/main ──"
            git diff --stat origin/main...HEAD -- backend/ || true
          fi
          echo "── manifest fingerprint ──"
          sha256sum backend/requirements.txt

      - name: syntax gate
        run: python -m compileall -q backend

      - name: lint
        run: |
          pip install "ruff>=0.9,<1.0"
          ruff check backend --select E9,F --no-fix

      - name: resolve-check requirements
        # full dependency resolution without installing — a broken graph
        # fails HERE with pip's complete log, not inside an opaque buildx run.
        # The manifest is echoed first so the log proves WHICH file resolved.
        # Resolution defaults to PyPI: an org mirror missing recent releases
        # ("no matching distributions available") has broken this step before;
        # override with a repository variable if you must use a mirror.
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
        run: |
          python -m pip install --upgrade pip
          echo "── manifest under test (backend/requirements.txt @ $(git rev-parse --short HEAD)) ──"
          cat backend/requirements.txt
          echo "──────────────────────────────────────────────────────"
          pip --version
          echo "index: $PIP_INDEX_URL"
          pip install --dry-run -r backend/requirements.txt

      - name: vuln-scan (pip-audit + bandit)
        # "vulnerability-free" is enforced HERE, not hoped for:
        #  · pip-audit resolves the manifest and audits every version
        #    against the OSV database (crewai's own tree is included)
        #  · bandit scans our source at MEDIUM severity or above
        # A finding fails the job — fix the pin or the code; never
        # silence this step with --skip or an ignore file.
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
        run: |
          pip install --quiet "pip-audit>=2.7,<3" "bandit>=1.8,<2"
          echo "── dependency graph audit ──"
          pip-audit -r backend/requirements.txt --disable-pip --progress-spinner off
          echo "── source scan (medium severity +) ──"
          bandit -r backend -ll -q

  images:
    # ⏸ GATED — nothing is pushed to ghcr.io until the production stage.
    # To re-enable: repo Settings → Variables → ENABLE_IMAGE_PUBLISH = true
    needs: [web, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # full build logs instead of the "check build summary" black box
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4

      - name: verify build-context dependencies
        # ?raw imports inlined into the web bundle — if any of these is
        # missing, or ever re-excluded via .dockerignore, fail loudly here
        # instead of inside an opaque buildx run
        run: |
          for f in backend/server.py backend/.env.example backend/Dockerfile \
                   deploy/Dockerfile.web deploy/nginx.conf \
                   .github/workflows/ci.yml docker-compose.yml README.md; do
            test -f "$f" || { echo "::error::build-context dependency missing: $f (check .dockerignore)"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-to: type=gha,mode=max
