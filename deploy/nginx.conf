# ── AI CoAudS console — production serving ───────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # security headers — CSP allows exactly the APIs the console calls
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://api.anthropic.com https://api.openai.com; img-src 'self' data:; frame-ancestors 'none'" always;

    # hashed assets — immutable for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # health probe for orchestrators
    location = /health.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback + never cache the shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
